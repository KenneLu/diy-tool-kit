name: release

# Tag v<semver> -> build the Windows package and publish it as a GitHub Release.
# Zip layout: a top-level <APP_ID>-<ver>/ folder + .sha256 (what update_helper
# expects). ASCII-safe; version read from appconfig.py (single source).

run-name: ${{ startsWith(github.ref, 'refs/tags/v') && format('release {0}', github.ref_name) || 'build only (no release)' }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psutil pystray pillow pyinstaller   # + this tool's deps

      - name: Read version from appconfig.py
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path appconfig.py -Pattern '^VERSION = ' | Select-Object -First 1
          if (-not $line) { throw "VERSION not found in appconfig.py" }
          $version = ($line.Line -split '"')[1]
          "version=$version" >> $env:GITHUB_OUTPUT
          "package=<APP_ID>-$version" >> $env:GITHUB_OUTPUT

      - name: Build (PyInstaller onedir, noconsole)
        shell: pwsh
        run: |
          $pkg = "${{ steps.version.outputs.package }}"
          python -m PyInstaller --noconfirm --clean --onedir --noconsole `
            --name $pkg --distpath build\dist_tmp --workpath build\work --specpath build `
            main.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Move-Item "build\dist_tmp\$pkg" "release\$pkg"
          if (-not (Test-Path "release\$pkg\<APP_ID>.exe")) { throw "build produced no exe" }

      - name: Package zip
        shell: pwsh
        run: |
          $pkg = "${{ steps.version.outputs.package }}"
          Compress-Archive -Path "release/$pkg" -DestinationPath "release/$pkg-windows-x64.zip"
          Get-FileHash "release/$pkg-windows-x64.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $pkg-windows-x64.zip" } |
            Set-Content "release/$pkg-windows-x64.zip.sha256"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $pkg = "${{ steps.version.outputs.package }}"
          gh release create $tag "release/$pkg-windows-x64.zip" "release/$pkg-windows-x64.zip.sha256" `
            --title "$pkg" --notes "Windows package: unpack and run."
