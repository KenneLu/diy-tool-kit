name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"   # suites print Chinese; a pipe would decode cp1252 and die
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psutil pystray pillow   # + this tool's deps

      - name: Compile check
        run: python -m py_compile main.py

      - name: Unit tests (if present)
        run: |
          if (Test-Path "test_*.py") { python -m pytest -q } else { Write-Host "no tests" }
        shell: pwsh
