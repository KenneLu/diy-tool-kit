name: release

# Tag v<semver> -> build the Windows package and publish it as a GitHub Release.
# Naming rule (2026-10-26): NO version in any path resolved at runtime. Zip layout =
# a single stable <APP_ID>/ folder + .sha256; the version lives in the exe's PE
# metadata (build_release/version_file.py + PyInstaller --version-file) and in the
# release ASSET name (the download URL needs it). See build_release/README.md.

run-name: ${{ startsWith(github.ref, 'refs/tags/v') && format('release {0}', github.ref_name) || 'build only (no release)' }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psutil pystray pillow pyinstaller   # + this tool's deps

      - name: Read version from appconfig.py
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path appconfig.py -Pattern '^VERSION = ' | Select-Object -First 1
          if (-not $line) { throw "VERSION not found in appconfig.py" }
          $version = ($line.Line -split '"')[1]
          "version=$version" >> $env:GITHUB_OUTPUT
          "package=<APP_ID>-$version" >> $env:GITHUB_OUTPUT
          "app_id=<APP_ID>" >> $env:GITHUB_OUTPUT

      - name: Build (PyInstaller onedir, noconsole, version in PE metadata)
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $appId = "${{ steps.version.outputs.app_id }}"
          $pkg = "${{ steps.version.outputs.package }}"
          New-Item -ItemType Directory -Force -Path build | Out-Null
          # Absolute path: with --specpath, PyInstaller resolves relative --version-file
          # against the spec dir (measured trap, see build_release/README.md).
          $versionFile = Join-Path $PWD "build\version_info.txt"
          python src/template/build_release/version_file.py $versionFile $version $appId <COMPANY>
          if ($LASTEXITCODE -ne 0) { throw "version metadata generation failed" }
          python -m PyInstaller --noconfirm --clean --onedir --noconsole `
            --name $appId --version-file $versionFile `
            --distpath build\dist_tmp --workpath build\work --specpath build `
            main.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Move-Item "build\dist_tmp\$appId" "release\$pkg"
          if (-not (Test-Path "release\$pkg\$appId.exe")) { throw "build produced no exe" }

      - name: Package zip (stable APP_ID/ layout; version only in PE metadata)
        shell: pwsh
        run: |
          $pkg = "${{ steps.version.outputs.package }}"
          $version = "${{ steps.version.outputs.version }}"
          $appId = "${{ steps.version.outputs.app_id }}"
          $dir = "release/$pkg"
          # Stable paths: the zip's inner folder is the APP_ID, never the version.
          $stageRoot = Join-Path ([System.IO.Path]::GetTempPath()) "ota-stage-$pkg"
          $stage = Join-Path $stageRoot $appId
          if (Test-Path $stageRoot) { Remove-Item $stageRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -Path "$dir/*" -Destination $stage -Recurse -Force
          $zip = "release/$pkg-windows-x64.zip"
          Compress-Archive -Path $stage -DestinationPath $zip
          Remove-Item $stageRoot -Recurse -Force
          # OTA layout gate + PE version gate: fail before publishing, not at update time.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip).Path)
          try {
            $tops = @($archive.Entries | ForEach-Object { ($_.FullName -split '/')[0] } | Sort-Object -Unique)
            if ($tops.Count -ne 1 -or $tops[0] -ne $appId) {
              throw "OTA layout gate: zip top-level = [$($tops -join ', ')], expected [$appId] (stable, no version)"
            }
            if (-not ($archive.Entries | Where-Object { $_.FullName -eq "$appId/$appId.exe" })) {
              throw "OTA layout gate: $appId/$appId.exe missing from zip"
            }
          } finally {
            $archive.Dispose()
          }
          $fv = (Get-Item "$dir/$appId.exe").VersionInfo.FileVersion
          if (-not $fv -or -not $fv.StartsWith($version)) {
            throw "PE version gate: FileVersion='$fv', expected '$version' (use --version-file)"
          }
          Get-FileHash $zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $pkg-windows-x64.zip" } |
            Set-Content "release/$pkg-windows-x64.zip.sha256"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $pkg = "${{ steps.version.outputs.package }}"
          gh release create $tag "release/$pkg-windows-x64.zip" "release/$pkg-windows-x64.zip.sha256" `
            --title "$pkg" --notes "Windows package: unpack and run."
